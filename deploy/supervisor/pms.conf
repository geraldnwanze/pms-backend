; Keeps the queue worker and the scheduler running. Copy to /etc/supervisor/conf.d/pms.conf, change the two paths and
; the user, then:  supervisorctl reread && supervisorctl update
;
; After every deploy run `php artisan queue:restart`: the worker finishes its current job and supervisor starts it
; again on the new code.

[program:pms-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pms-backend/artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/pms-backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; `--timeout` is 60s and `retry_after` is 90s, so a job can never be picked up by a second worker while the first is still on it.
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/pms-backend/storage/logs/worker.log

[program:pms-scheduler]
command=php /var/www/pms-backend/artisan schedule:work
directory=/var/www/pms-backend
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/pms-backend/storage/logs/scheduler.log
