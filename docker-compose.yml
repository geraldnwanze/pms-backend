services:
  postgres:
    image: postgres:17-alpine
    container_name: pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
    ports:
      # Host 5433 -> container 5432, to avoid clashing with a system Postgres.
      - "5433:5432"
    volumes:
      - pms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pms-postgres-data:
